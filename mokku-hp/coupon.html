<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホームページをご覧の方へ｜珈琲の店 もっく</title>
<meta name="description" content="珈琲の店 もっくのホームページをご覧の方へ。この画面をレジでお見せください。">
<!-- 検索から直接来られると「ホームページを見た方」の条件が崩れるため -->
<meta name="robots" content="noindex, nofollow">

<meta name="theme-color" content="#FBF8F2">
<link rel="icon" href="images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Shippori+Mincho:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.className += ' js';</script>
</head>
<body class="coupon-page">

<a class="skip" href="#main">本文へ移動</a>

<main id="main" class="cbody">
  <div class="text">

    <div class="ticket">
      <div class="ticket__body">
        <p class="ticket__logo"><picture><source srcset="images/logo.webp" type="image/webp"><img src="images/logo.png" width="400" height="400" alt="珈琲の店 もっく"></picture></p>
        <p class="ticket__shop" translate="no">KOHI NO MISE MOKKU</p>

        <h1 class="ticket__offer"><span class="ticket__num">100</span>円引き</h1>
        <p class="ticket__for">はじめてご来店の方へ</p>

        <p class="ticket__use">この画面をレジでお見せください</p>
        <p class="ticket__date"><small>本日</small><span id="today">　</span></p>

        <p class="ticket__done" id="used" hidden>ご利用ありがとうございました。またお待ちしています。</p>
      </div>
    </div>

    <p class="cback"><a href="index.html">お店のページに戻る</a></p>

  </div>
</main>

<script src="js/main.js"></script>
</body>
</html>
